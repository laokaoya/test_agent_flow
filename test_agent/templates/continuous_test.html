<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连续测试 - 儿童AI对话测试平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }
        .metric-card {
            border-left: 4px solid #28a745;
            transition: all 0.3s ease;
        }
        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .metric-score {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        .conversation-round {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #007bff;
        }
        .child-response {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-left: 4px solid #2196f3;
        }
        .ai-response {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border-left: 4px solid #9c27b0;
        }
        .stop-reason {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-left: 4px solid #f44336;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .loading {
            display: none;
        }
        .child-card {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .child-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.2);
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin: 20px 0;
        }
        .threshold-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #dc3545;
            z-index: 10;
        }
        .metric-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .metric-indicator.high { background-color: #28a745; }
        .metric-indicator.medium { background-color: #ffc107; }
        .metric-indicator.low { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 左侧配置面板 -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-infinity"></i> 连续测试配置</h4>
                    </div>
                    <div class="card-body">
                        <!-- 测试角色配置 -->
                        <h5><i class="fas fa-child"></i> 测试角色</h5>
                        <div id="children-container">
                            <!-- 默认角色将自动加载 -->
                        </div>
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn btn-outline-primary btn-sm" onclick="addChild()">
                                <i class="fas fa-plus"></i> 添加自定义角色
                            </button>
                            <div class="dropdown">
                                <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="fas fa-user-plus"></i> 快速添加内置角色
                                </button>
                                <ul class="dropdown-menu" id="preset-children-menu">
                                    <li><a class="dropdown-item text-muted" href="#">加载中...</a></li>
                                </ul>
                            </div>
                        </div>

                        <!-- 阈值设置 -->
                        <h5 class="mt-4"><i class="fas fa-sliders-h"></i> 停止阈值设置</h5>
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="max-rounds" class="form-label">
                                        <strong>最大对话轮数</strong>
                                        <small class="text-muted">(达到此轮数时自动停止)</small>
                                    </label>
                                    <input type="range" class="form-range" id="max-rounds" min="10" max="100" value="50">
                                    <div class="d-flex justify-content-between">
                                        <small>10</small>
                                        <span id="max-rounds-value" class="badge bg-info">50</span>
                                        <small>100</small>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="interest-threshold" class="form-label">
                                        <strong>兴趣分数阈值</strong>
                                        <small class="text-muted">(低于此分数时停止对话)</small>
                                    </label>
                                    <input type="range" class="form-range" id="interest-threshold" min="0" max="100" value="30">
                                    <div class="d-flex justify-content-between">
                                        <small>0</small>
                                        <span id="interest-threshold-value" class="badge bg-primary">30</span>
                                        <small>100</small>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="attention-threshold" class="form-label">
                                        <strong>注意力分数阈值</strong>
                                        <small class="text-muted">(低于此分数时停止对话)</small>
                                    </label>
                                    <input type="range" class="form-range" id="attention-threshold" min="0" max="100" value="25">
                                    <div class="d-flex justify-content-between">
                                        <small>0</small>
                                        <span id="attention-threshold-value" class="badge bg-success">25</span>
                                        <small>100</small>
                                    </div>
                                </div>
                                <div class="mb-0">
                                    <label for="experience-threshold" class="form-label">
                                        <strong>体验分数阈值</strong>
                                        <small class="text-muted">(低于此分数时停止对话)</small>
                                    </label>
                                    <input type="range" class="form-range" id="experience-threshold" min="0" max="100" value="20">
                                    <div class="d-flex justify-content-between">
                                        <small>0</small>
                                        <span id="experience-threshold-value" class="badge bg-warning">20</span>
                                        <small>100</small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-primary" onclick="startContinuousTest()" id="start-test-btn">
                                <i class="fas fa-play"></i> 开始连续测试
                            </button>
                            <button class="btn btn-danger" onclick="stopContinuousTest()" id="stop-test-btn" style="display: none;">
                                <i class="fas fa-stop"></i> 停止测试
                            </button>
                            <a href="/" class="btn btn-info">
                                <i class="fas fa-arrow-left"></i> 返回主页面
                            </a>
                            <button class="btn btn-warning" onclick="clearResults()">
                                <i class="fas fa-trash"></i> 清空结果
                            </button>
                        </div>
                        
                        <!-- 测试统计 -->
                        <div id="test-stats" class="mt-3" style="display: none;">
                            <div class="alert alert-info">
                                <h6 class="mb-2"><i class="fas fa-chart-line"></i> 测试统计</h6>
                                <div class="small">
                                    <div>当前轮数：<strong id="current-round">0</strong></div>
                                    <div>运行时间：<strong id="test-duration">00:00:00</strong></div>
                                    <div>状态：<strong id="test-status">运行中</strong></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧结果面板 -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fas fa-chart-line"></i> 连续测试结果</h4>
                        <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#settingsModal">
                            <i class="fas fa-cog"></i> 设置
                        </button>
                    </div>
                    <div class="card-body">
                        <!-- 加载状态 -->
                        <div class="loading text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">测试中...</span>
                            </div>
                            <p class="mt-2">正在运行连续测试，请稍候...</p>
                        </div>

                        <!-- 结果展示 -->
                        <div id="results-container">
                            <div class="text-center text-muted">
                                <i class="fas fa-infinity fa-3x mb-3"></i>
                                <p>配置测试角色和阈值，然后点击"开始连续测试"</p>
                                <p class="small">连续测试将模拟真实的孩子对话体验，通过三个关键指标动态判断是否继续对话</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置模态弹窗 -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="settingsModalLabel">
                        <i class="fas fa-cog"></i> 高级设置
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- API密钥配置 -->
                    <h5 class="mb-3"><i class="fas fa-key"></i> API密钥配置</h5>
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="dify-api-key" class="form-label">
                                    <strong>Dify API Key</strong>
                                    <small class="text-muted">(可选，留空使用默认配置)</small>
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="dify-api-key" placeholder="留空使用默认密钥">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('dify-api-key')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <small class="form-text text-muted">用于连接Dify Agent</small>
                            </div>
                            <div class="mb-0">
                                <label for="gemini-api-key" class="form-label">
                                    <strong>Gemini API Key</strong>
                                    <small class="text-muted">(可选，留空使用默认配置)</small>
                                </label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="gemini-api-key" placeholder="留空使用默认密钥">
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('gemini-api-key')">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <small class="form-text text-muted">用于生成孩子回复和评分</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> 关闭
                    </button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
                        <i class="fas fa-check"></i> 保存设置
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== 连续测试全局变量 ==========
        let isContinuousTestRunning = false;
        let currentTestData = null;
        let testStartTime = null;
        let testTimer = null;
        let metricsChart = null;
        
        // 切换密码可见性
        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const button = input.nextElementSibling;
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // 获取用户设置的API密钥
        function getApiKeys() {
            const difyKey = document.getElementById('dify-api-key').value.trim();
            const geminiKey = document.getElementById('gemini-api-key').value.trim();
            
            return {
                dify_api_key: difyKey || null,
                gemini_api_key: geminiKey || null
            };
        }
        
        // 获取阈值设置
        function getThresholds() {
            return {
                max_rounds: parseInt(document.getElementById('max-rounds').value),
                interest: parseInt(document.getElementById('interest-threshold').value),
                attention: parseInt(document.getElementById('attention-threshold').value),
                experience: parseInt(document.getElementById('experience-threshold').value)
            };
        }
        
        // 更新阈值显示
        function updateThresholdDisplay() {
            document.getElementById('max-rounds-value').textContent = document.getElementById('max-rounds').value;
            document.getElementById('interest-threshold-value').textContent = document.getElementById('interest-threshold').value;
            document.getElementById('attention-threshold-value').textContent = document.getElementById('attention-threshold').value;
            document.getElementById('experience-threshold-value').textContent = document.getElementById('experience-threshold').value;
        }
        
        // 绑定阈值滑块事件
        document.getElementById('max-rounds').addEventListener('input', updateThresholdDisplay);
        document.getElementById('interest-threshold').addEventListener('input', updateThresholdDisplay);
        document.getElementById('attention-threshold').addEventListener('input', updateThresholdDisplay);
        document.getElementById('experience-threshold').addEventListener('input', updateThresholdDisplay);
        
        // 内置角色数据
        let presetChildren = {};
        let addedChildrenIds = new Set();

        // 从API加载内置角色数据
        async function loadPresetChildren() {
            try {
                const response = await fetch('/api/preset-children');
                if (response.ok) {
                    presetChildren = await response.json();
                    updatePresetChildrenMenu();
                    console.log('✅ 内置角色加载成功:', Object.keys(presetChildren).length, '个角色');
                    
                    // 自动添加第一个预设角色作为默认角色
                    const firstPresetId = Object.keys(presetChildren)[0];
                    if (firstPresetId) {
                        addPresetChild(firstPresetId);
                        addedChildrenIds.add(firstPresetId);
                        console.log('✅ 已自动添加默认角色:', presetChildren[firstPresetId].name);
                        updatePresetChildrenMenu();
                    }
                } else {
                    console.error('❌ 加载内置角色失败:', response.status);
                }
            } catch (error) {
                console.error('❌ 加载内置角色异常:', error);
            }
        }

        // 更新内置角色下拉菜单
        function updatePresetChildrenMenu() {
            const menu = document.getElementById('preset-children-menu');
            if (!menu) return;
            
            menu.innerHTML = '';
            
            const availableChildren = Object.entries(presetChildren).filter(([id, child]) => !addedChildrenIds.has(id));
            
            if (availableChildren.length === 0) {
                menu.innerHTML = '<li><a class="dropdown-item text-muted" href="#">所有角色已添加</a></li>';
                return;
            }
            
            for (const [id, child] of availableChildren) {
                const menuItem = document.createElement('li');
                menuItem.innerHTML = `
                    <a class="dropdown-item" href="#" onclick="addPresetChild('${id}'); return false;">
                        ${child.emoji || '🧒'} ${child.name} - ${child.type || '测试型'}
                    </a>
                `;
                menu.appendChild(menuItem);
            }
        }

        // 添加预设角色
        function addPresetChild(presetId) {
            const preset = presetChildren[presetId];
            if (!preset) return;
            
            if (addedChildrenIds.has(presetId)) {
                console.log('⚠️ 角色已存在，不重复添加:', preset.name);
                return;
            }
            
            const container = document.getElementById('children-container');
            const childCard = document.createElement('div');
            childCard.className = 'child-card';
            childCard.setAttribute('data-preset-id', presetId);
            childCard.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" class="form-control form-control-sm mb-2" placeholder="姓名" value="${preset.name}" style="font-size: 0.85rem;">
                    </div>
                    <div class="col-md-6">
                        <input type="number" class="form-control form-control-sm mb-2" placeholder="年龄" value="${preset.age}" style="font-size: 0.85rem;">
                    </div>
                </div>
                <textarea class="form-control form-control-sm mb-2" placeholder="性格特点" rows="4" style="font-size: 0.85rem;">${preset.traits}</textarea>
                <textarea class="form-control form-control-sm mb-2" placeholder="开场白" rows="2" style="font-size: 0.85rem;">${preset.opening}</textarea>
                <button class="btn btn-sm btn-danger" onclick="removeChildCard(this)"><i class="fas fa-trash"></i> 删除</button>
            `;
            container.appendChild(childCard);
            
            addedChildrenIds.add(presetId);
            updatePresetChildrenMenu();
        }
        
        // 添加自定义测试角色
        function addChild() {
            const container = document.getElementById('children-container');
            const childCard = document.createElement('div');
            childCard.className = 'child-card';
            childCard.innerHTML = `
                <div class="row">
                    <div class="col-md-6">
                        <input type="text" class="form-control form-control-sm mb-2" placeholder="姓名" value="新角色" style="font-size: 0.85rem;">
                    </div>
                    <div class="col-md-6">
                        <input type="number" class="form-control form-control-sm mb-2" placeholder="年龄" value="8" style="font-size: 0.85rem;">
                    </div>
                </div>
                <textarea class="form-control form-control-sm mb-2" placeholder="性格特点" rows="4" style="font-size: 0.85rem;">活泼好动，喜欢运动和游戏。</textarea>
                <textarea class="form-control form-control-sm mb-2" placeholder="开场白" rows="2" style="font-size: 0.85rem;">你好！我们来玩个游戏吧！</textarea>
                <button class="btn btn-sm btn-danger" onclick="removeChildCard(this)"><i class="fas fa-trash"></i> 删除</button>
            `;
            container.appendChild(childCard);
        }

        // 删除测试角色
        function removeChildCard(button) {
            const childCard = button.closest('.child-card');
            const presetId = childCard.getAttribute('data-preset-id');
            
            if (document.querySelectorAll('.child-card').length > 1) {
                childCard.remove();
                
                if (presetId) {
                    addedChildrenIds.delete(presetId);
                    updatePresetChildrenMenu();
                    console.log('✅ 已移除角色:', presetId);
                }
            } else {
                alert('至少需要保留一个测试角色');
            }
        }

        // 开始连续测试
        async function startContinuousTest() {
            if (isContinuousTestRunning) {
                alert('连续测试已经在运行中！');
                return;
            }
            
            // 收集配置数据
            const children = [];
            document.querySelectorAll('.child-card').forEach(card => {
                const inputs = card.querySelectorAll('input, textarea');
                children.push({
                    name: inputs[0].value,
                    age: parseInt(inputs[1].value),
                    traits: inputs[2].value,
                    opening: inputs[3].value
                });
            });

            if (children.length === 0) {
                alert('请至少添加一个测试角色！');
                return;
            }

            // 确认开始
            if (!confirm('确定要开始连续测试吗？\n\n测试将持续运行直到某个指标低于阈值，或您手动停止。')) {
                return;
            }

            // 设置状态
            isContinuousTestRunning = true;
            testStartTime = new Date();
            
            // 更新UI
            document.getElementById('start-test-btn').style.display = 'none';
            document.getElementById('stop-test-btn').style.display = 'block';
            document.getElementById('test-stats').style.display = 'block';
            document.getElementById('test-status').textContent = '运行中';
            
            // 启动计时器
            testTimer = setInterval(updateTestDuration, 1000);
            
            // 开始测试
            console.log('🚀 连续测试已启动');
            await runContinuousTest(children[0]); // 目前只测试第一个角色
        }
        
        // 停止连续测试
        function stopContinuousTest() {
            if (!isContinuousTestRunning) {
                return;
            }
            
            if (!confirm('确定要停止连续测试吗？')) {
                return;
            }
            
            isContinuousTestRunning = false;
            
            if (testTimer) {
                clearInterval(testTimer);
                testTimer = null;
            }
            
            document.getElementById('start-test-btn').style.display = 'block';
            document.getElementById('stop-test-btn').style.display = 'none';
            document.getElementById('test-status').textContent = '已停止';
            
            console.log('⏸️ 连续测试已停止');
        }
        
        // 更新运行时间显示
        function updateTestDuration() {
            if (!testStartTime) return;
            
            const now = new Date();
            const duration = Math.floor((now - testStartTime) / 1000);
            
            const hours = Math.floor(duration / 3600);
            const minutes = Math.floor((duration % 3600) / 60);
            const seconds = duration % 60;
            
            const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('test-duration').textContent = timeStr;
        }

        // 运行连续测试
        async function runContinuousTest(child) {
            const container = document.getElementById('results-container');
            const thresholds = getThresholds();
            const apiKeys = getApiKeys();
            
            // 初始化测试数据
            currentTestData = {
                child: child,
                conversation_history: [],
                metrics_history: [],
                round: 0,
                is_stopped: false,
                stop_reason: '',
                stop_trigger: ''
            };
            
            // 显示测试界面
            showContinuousTestInterface();
            
            let conversationId = null;
            let currentMessage = child.opening;
            
            // 开始对话循环
            while (isContinuousTestRunning && !currentTestData.is_stopped) {
                currentTestData.round++;
                document.getElementById('current-round').textContent = currentTestData.round;
                
                // 检查是否达到最大轮数或总轮数上限
                if (currentTestData.round > thresholds.max_rounds) {
                    currentTestData.is_stopped = true;
                    currentTestData.stop_trigger = '达到最大对话轮数';
                    break;
                }
                
                // 检查总轮数上限（50轮）
                if (currentTestData.round > 50) {
                    currentTestData.is_stopped = true;
                    currentTestData.stop_trigger = '达到总轮数上限(50轮)';
                    break;
                }
                
                try {
                    // 1. 获取AI回复
                    const aiResponse = await fetch('/api/test-round', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            round_num: currentTestData.round,
                            conversation_id: conversationId,
                            message: currentMessage,
                            ...apiKeys
                        })
                    });
                    
                    if (!aiResponse.ok) {
                        throw new Error('AI回复失败');
                    }
                    
                    const aiResult = await aiResponse.json();
                    if (!aiResult.success) {
                        throw new Error(aiResult.message || 'AI回复失败');
                    }
                    
                    conversationId = aiResult.conversation_id;
                    
                    // 2. 生成孩子回应和三个指标分数
                    const childResponse = await fetch('/api/continuous-test/round', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            child: child,
                            ai_response: aiResult.ai_response,
                            round_num: currentTestData.round,
                            conversation_history: currentTestData.conversation_history,
                            ...apiKeys
                        })
                    });
                    
                    if (!childResponse.ok) {
                        throw new Error('生成孩子回应失败');
                    }
                    
                    const childResult = await childResponse.json();
                    if (!childResult.success) {
                        throw new Error('生成孩子回应失败');
                    }
                    
                    // 3. 记录对话和指标
                    const conversation = {
                        round: currentTestData.round,
                        user_message: currentMessage,
                        ai_response: aiResult.ai_response,
                        child_response: childResult.child_response,
                        timestamp: childResult.timestamp
                    };
                    
                    const metrics = {
                        round: currentTestData.round,
                        interest_score: childResult.interest_score,
                        attention_score: childResult.attention_score,
                        experience_score: childResult.experience_score,
                        timestamp: childResult.timestamp
                    };
                    
                    currentTestData.conversation_history.push(conversation);
                    currentTestData.metrics_history.push(metrics);
                    
                    // 4. 显示这一轮的结果
                    displayContinuousTestRound(conversation, metrics);
                    
                    // 5. 检查是否应该停止
                    if (childResult.interest_score < thresholds.interest) {
                        currentTestData.is_stopped = true;
                        currentTestData.stop_trigger = '兴趣分数过低';
                    } else if (childResult.attention_score < thresholds.attention) {
                        currentTestData.is_stopped = true;
                        currentTestData.stop_trigger = '注意力分数过低';
                    } else if (childResult.experience_score < thresholds.experience) {
                        currentTestData.is_stopped = true;
                        currentTestData.stop_trigger = '体验分数过低';
                    }
                    
                    // 6. 准备下一轮
                    if (!currentTestData.is_stopped) {
                        // 第一轮后，准备下一轮的孩子回应
                        if (currentTestData.round == 1) {
                            // 第一轮后，生成孩子的回应作为下一轮的输入
                            const nextChildResponse = await fetch('/api/continuous-test/round', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    child: child,
                                    ai_response: aiResult.ai_response,
                                    round_num: currentTestData.round + 1,
                                    conversation_history: currentTestData.conversation_history,
                                    ...apiKeys
                                })
                            });
                            
                            if (nextChildResponse.ok) {
                                const nextChildResult = await nextChildResponse.json();
                                if (nextChildResult.success) {
                                    currentMessage = nextChildResult.child_response;
                                }
                            }
                        } else {
                            currentMessage = childResult.child_response;
                        }
                    }
                    
                    // 添加延迟，让用户能看到实时效果
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    
                } catch (error) {
                    console.error('连续测试出错:', error);
                    alert('❌ 连续测试出错：' + error.message);
                    break;
                }
            }
            
            // 测试结束
            if (currentTestData.is_stopped) {
                await handleTestStop();
                // 自动保存连续测试数据
                await saveContinuousTestData();
            }
        }

                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit'
                        })
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        console.log('✅ 连续测试数据已保存');
                    } else {
                        console.error('❌ 保存连续测试数据失败:', result.message);
                    }
                }
            } catch (error) {
                console.error('❌ 保存连续测试数据出错:', error);
            }
        }
        
        // 清空结果
        function clearResults() {
            if (confirm('确定要清空所有结果吗？')) {
                currentTestData = null;
                if (metricsChart) {
                    metricsChart.destroy();
                    metricsChart = null;
                }
                document.getElementById('results-container').innerHTML = `
                    <div class="text-center text-muted">
                        <i class="fas fa-infinity fa-3x mb-3"></i>
                        <p>配置测试角色和阈值，然后点击"开始连续测试"</p>
                        <p class="small">连续测试将模拟真实的孩子对话体验，通过三个关键指标动态判断是否继续对话</p>
                    </div>
                `;
            }
        }
        
        // 页面加载时自动加载内置角色
        document.addEventListener('DOMContentLoaded', function() {
            loadPresetChildren();
        });
    </script>
</body>
</html>
